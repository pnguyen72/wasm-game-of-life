[package]
name = "lab4"
version = "0.1.0"
edition = "2024"
authors = ["felix"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
console_error_panic_hook = "0.1.7"
wasm-bindgen = "0.2.129"
rand = "0.10.3"
getrandom = { version = "0.4.3", features = ["wasm_js"] }


[lints.clippy]
pedantic =  { level = "warn", priority = -1 }
nursery =  { level = "warn", priority = -1 }
must_use_candidate = "allow" # not applicable to wasm
missing_const_for_fn = "allow" # wasm does not support const fn
