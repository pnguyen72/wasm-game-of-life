<!doctype html>
<html lang="en-US">
	<head>
		<meta charset="utf-8" />
		<title>Modified game of life</title>
		<style>
			body {
				background-color: rgb(31, 29, 46);
				button:not(:disabled) {
					cursor: pointer;
				}
				input:not(:disabled) {
					cursor: grab;
				}
			}
		</style>
	</head>
	<body>
		<input id="p_alive" type="range" min="1" max="70" />
		<button id="play/pause" type="button">Play</button>
		<button id="step/restart" type="button">Step</button>
		<canvas id="canvas"></canvas>
		<input id="speed" type="range" min="-40" max="0" />

		<script type="module">
			import init from "./pkg/lab4.js";

			init();
		</script>
	</body>
</html>
