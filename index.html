<!doctype html>
<html lang="en-US">
	<head>
		<meta charset="utf-8" />
		<title>Game of life</title>
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<main>
			<div class="controls">
				<div class="slider left">
					<label for="p_alive">Initial life density</label>
					<input id="p_alive" type="range" min="1" max="70" />
				</div>
				<div class="buttons">
					<button id="play/pause" type="button">Play</button>
					<button id="step/restart" type="button">Step</button>
				</div>
				<div class="slider right">
					<label for="speed">Simulation speed</label>
					<input id="speed" type="range" min="-40" max="0" />
				</div>
			</div>
			<div class="canvas-container">
				<canvas id="canvas"></canvas>
			</div>
		</main>
		<div id="loading-spinner" role="status" aria-label="Loading"></div>

		<script type="module">
			import init from "./pkg/game_of_life.js";

			init();
		</script>
	</body>
</html>
